[package]
name = "qd-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { workspace = true, features = ["bmp", "tiff"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xfixes"] }
libc = "0.2"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
tokio = { version = "1", features = ["sync", "time"] }



[target.'cfg(target_os = "macos")'.dependencies]
tokio = { version = "1", features = ["time"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSRunningApplication",
    "NSWorkspace",
] }
core-graphics = "0.25"
core-foundation = "0.9"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["time"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
