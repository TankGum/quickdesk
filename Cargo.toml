[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
qd-core = { path = "crates/qd-core" }
qd-platform = { path = "crates/qd-platform" }
qd-notes = { path = "crates/qd-notes" }
qd-ports = { path = "crates/qd-ports" }
qd-clipboard = { path = "crates/qd-clipboard" }
qd-sync = { path = "crates/qd-sync" }
qd-ai-usage = { path = "crates/qd-ai-usage" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "v5"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
