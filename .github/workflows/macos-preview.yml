name: macOS preview

# Run by hand (Actions → macOS preview → Run workflow) to get a Mac build to
# try, without publishing anything: a .dmg for Apple Silicon, signed ad hoc.
# Uploaded as is (not zipped), so the run's artifact downloads as the .dmg.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build --bundles app,dmg
      - name: Find the dmg
        id: dmg
        run: echo "path=$(ls target/release/bundle/dmg/*.dmg | head -n 1)" >> "$GITHUB_OUTPUT"
      # archive: false uploads the single file as it is; the artifact takes
      # the file's name (QuickDesk_<version>_aarch64.dmg).
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.dmg.outputs.path }}
          archive: false
