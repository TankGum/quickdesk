name: Release

# Push a tag like v0.2.0 (matching "version" in src-tauri/tauri.conf.json) to
# build the Linux packages and publish them to the Cloudflare R2 bucket.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # Creates the GitHub Release for the tag.
  contents: write

jobs:
  linux:
    # Oldest supported runner with webkit2gtk-4.1: packages built here also
    # install on newer distributions (glibc is backwards compatible).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match tauri.conf.json version $version"
            exit 1
          fi

      # Fail before the long build if nobody wrote what changed.
      - name: Release notes exist
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          python3 scripts/changelog.py check "$version"

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libdbus-1-dev \
            patchelf libfuse2 file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Signs every package for the in-app updater (<package>.sig); the
      # public half of this key is plugins.updater.pubkey in tauri.conf.json.
      - name: Build packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          npx tauri build --bundles deb,rpm,appimage
          --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Keep a copy on the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: quickdesk-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/*/*.sig

      - name: Publish to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Public base URL of the bucket (update.json links must be absolute).
          R2_PUBLIC_URL: https://dl.quickdesk.click
        run: python3 scripts/publish_r2.py

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/changelog.py notes "$version" > release-notes.md
          echo "" >> release-notes.md
          echo "Download: https://quickdesk.click/download" >> release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "QuickDesk $version" --notes-file release-notes.md \
            target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
            target/release/bundle/appimage/*.AppImage target/release/bundle/*/*.sig \
            target/release/publish/SHA256SUMS

      # The website (Cloudflare Pages) shows the newest release from
      # latest.json; rebuild it now that there is a new one.
      - name: Rebuild the website
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" >/dev/null && echo "website rebuild started"; else echo "::warning::CF_PAGES_DEPLOY_HOOK is not set; the website still shows the previous release"; fi
