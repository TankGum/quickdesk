name: Windows preview

# Run by hand (Actions → Windows preview → Run workflow) to get a Windows
# installer to try, without publishing anything. The installer is attached
# to the run as the "quickdesk-windows-preview" artifact.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: quickdesk-windows-preview
          path: target/release/bundle/nsis/*.exe
